name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      # The live integration tests publish a synthetic stream with ffmpeg to a
      # mediamtx RTSP server and pull it back through RTSPClientSession, so both
      # tools must be on PATH. See README "Testing".
      - name: Install integration test dependencies
        run: brew install ffmpeg mediamtx

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test -v

  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check formatting
        run: xcrun swift-format lint --strict -r Sources/ Tests/ Examples/
